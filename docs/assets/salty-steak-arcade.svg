<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Salty Steak, Base Steak 2.0</title>
  <desc id="desc">An animated pixel-art workstation with the Salty Steak emblem, model name, application modes, and author</desc>
  <defs>
    <radialGradient id="room" cx="43%" cy="30%" r="86%">
      <stop offset="0" stop-color="#28265a"/>
      <stop offset=".46" stop-color="#171a3a"/>
      <stop offset="1" stop-color="#090c1c"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111b35"/>
      <stop offset="1" stop-color="#090e20"/>
    </linearGradient>
    <filter id="aqua-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coral-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen-clip"><rect x="248" y="105" width="190" height="126" rx="4"/></clipPath>
    <style>
      .pixel{shape-rendering:crispEdges}
      .spark{animation:spark 2.8s steps(2,end) infinite;transform-box:fill-box;transform-origin:center}
      .spark.b{animation-delay:.7s}.spark.c{animation-delay:1.4s}.spark.d{animation-delay:2.1s}
      .screen-light{animation:screen 4s steps(5,end) infinite}
      .scan{animation:scan 3.8s linear infinite}
      .cursor{animation:blink 1s steps(1,end) infinite}
      .steam.one{animation:steam 2.8s steps(6,end) infinite}
      .steam.two{animation:steam 2.8s .9s steps(6,end) infinite}
      .head{animation:bob 3.4s steps(4,end) infinite;transform-box:fill-box;transform-origin:center}
      .meter.one{animation:meter 1.7s steps(4,end) infinite}.meter.two{animation:meter 1.7s .4s steps(4,end) infinite}.meter.three{animation:meter 1.7s .8s steps(4,end) infinite}
      .mode-a{animation:mode 3.2s steps(2,end) infinite}.mode-b{animation:mode 3.2s .8s steps(2,end) infinite}.mode-c{animation:mode 3.2s 1.6s steps(2,end) infinite}.mode-d{animation:mode 3.2s 2.4s steps(2,end) infinite}
      .packet-a{animation:packet-a 5.5s linear infinite}.packet-b{animation:packet-b 7s 1.8s linear infinite}
      .key-a{animation:key 1.9s steps(2,end) infinite}.key-b{animation:key 1.9s .45s steps(2,end) infinite}.key-c{animation:key 1.9s .9s steps(2,end) infinite}
      .signal-a{animation:signal 2.4s steps(4,end) infinite}.signal-b{animation:signal 2.4s .6s steps(4,end) infinite}.signal-c{animation:signal 2.4s 1.2s steps(4,end) infinite}
      .orbit-a{animation:orbit-a 8s linear infinite}.orbit-b{animation:orbit-b 10s 1.4s linear infinite}
      .ready{animation:ready 1.8s steps(2,end) infinite}
      @keyframes spark{0%,44%{opacity:.2;transform:scale(.55)}50%,100%{opacity:1;transform:scale(1)}}
      @keyframes screen{0%,100%{opacity:.82}50%{opacity:1}}
      @keyframes scan{from{transform:translateY(-140px)}to{transform:translateY(160px)}}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
      @keyframes steam{0%{opacity:0;transform:translateY(14px)}30%{opacity:.85}100%{opacity:0;transform:translateY(-30px)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes meter{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
      @keyframes mode{0%,72%{opacity:.72}73%,100%{opacity:1}}
      @keyframes packet-a{from{transform:translateX(0)}to{transform:translateX(720px)}}
      @keyframes packet-b{from{transform:translateX(0)}to{transform:translateX(-620px)}}
      @keyframes key{0%,65%{opacity:.42}66%,100%{opacity:1}}
      @keyframes signal{0%,100%{opacity:.3}50%{opacity:1}}
      @keyframes orbit-a{0%{transform:translate(0 0)}50%{transform:translate(24px -14px)}100%{transform:translate(0 0)}}
      @keyframes orbit-b{0%{transform:translate(0 0)}50%{transform:translate(-18px 18px)}100%{transform:translate(0 0)}}
      @keyframes ready{0%,72%{opacity:1}73%,100%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="1400" height="460" fill="url(#room)"/>
  <path d="M0 356c138-36 250-8 375 18 132 27 239 14 360-18 135-36 240-26 352 4 118 31 214 25 313-4v104H0z" fill="url(#floor)"/>
  <path d="M0 391c168-24 276 19 438 7 176-13 267-31 426-3 155 27 354 21 536-6v71H0z" fill="#0b1126"/>

  <g fill="#63ede5" filter="url(#aqua-glow)">
    <path class="spark" d="M92 75h8v8h8v8h-8v8h-8v-8h-8v-8h8z"/>
    <path class="spark b" d="M492 58h6v6h6v6h-6v6h-6v-6h-6v-6h6z"/>
    <path class="spark c" d="M1290 90h8v8h8v8h-8v8h-8v-8h-8v-8h8z"/>
    <path class="spark d" d="M1192 346h5v5h5v5h-5v5h-5v-5h-5v-5h5z"/>
  </g>
  <g fill="#ff6d74" opacity=".7">
    <rect x="112" y="260" width="9" height="9"/><rect x="470" y="320" width="7" height="7"/><rect x="1320" y="278" width="10" height="10"/>
  </g>
  <g class="pixel orbit-a" opacity=".8"><rect x="1020" y="86" width="12" height="12" fill="#ffcf66"/><rect x="1035" y="89" width="6" height="6" fill="#63ede5"/></g>
  <g class="pixel orbit-b" opacity=".75"><rect x="1274" y="326" width="10" height="10" fill="#d7c6ff"/><rect x="1264" y="329" width="5" height="5" fill="#ff6d74"/></g>

  <g class="pixel">
    <rect x="82" y="318" width="410" height="24" fill="#38234a"/>
    <rect x="110" y="342" width="30" height="82" fill="#261b38"/>
    <rect x="434" y="342" width="30" height="82" fill="#261b38"/>
    <rect x="221" y="82" width="244" height="184" rx="10" fill="#0a0f20" stroke="#665ca8" stroke-width="8"/>
    <rect x="248" y="105" width="190" height="126" rx="4" fill="#102842" class="screen-light"/>
    <g clip-path="url(#screen-clip)">
      <rect x="248" y="105" width="190" height="126" fill="#102842"/>
      <rect class="scan" x="248" y="104" width="190" height="10" fill="#72fff2" opacity=".09"/>
      <g fill="#63ede5">
        <rect x="271" y="140" width="10" height="42" class="meter one" transform-origin="276 182"/>
        <rect x="291" y="122" width="10" height="60" class="meter two" transform-origin="296 182"/>
        <rect x="311" y="151" width="10" height="31" class="meter three" transform-origin="316 182"/>
      </g>
      <text x="345" y="151" fill="#fff1cf" font-family="Consolas,monospace" font-size="19" font-weight="700">BASE STEAK</text>
      <text x="345" y="179" fill="#ffcf66" font-family="Consolas,monospace" font-size="22">2.0</text>
      <rect class="cursor" x="402" y="163" width="10" height="18" fill="#ff6d74"/>
      <rect x="271" y="202" width="132" height="5" fill="#786dd1"/><rect x="271" y="202" width="91" height="5" fill="#63ede5"/>
    </g>
    <rect x="323" y="266" width="40" height="38" fill="#25224d"/>
    <rect x="284" y="302" width="118" height="16" fill="#332b63"/>

    <g class="head">
      <rect x="122" y="134" width="106" height="118" rx="34" fill="#7d304d"/>
      <rect x="109" y="157" width="24" height="68" fill="#7d304d"/>
      <rect x="215" y="149" width="25" height="82" fill="#7d304d"/>
      <rect x="132" y="122" width="75" height="21" fill="#ff6d55"/>
      <rect x="125" y="143" width="94" height="82" fill="#f56a55"/>
      <rect x="139" y="225" width="68" height="20" fill="#d94d55"/>
      <rect x="151" y="151" width="42" height="42" fill="#ffd080"/>
      <rect x="161" y="161" width="22" height="22" fill="#fff2cf"/>
      <rect x="143" y="204" width="15" height="11" fill="#fff2cf"/><rect x="187" y="201" width="15" height="11" fill="#fff2cf"/>
      <rect x="159" y="205" width="12" height="7" fill="#29172f"/><rect x="175" y="205" width="12" height="7" fill="#29172f"/>
      <rect x="166" y="224" width="18" height="7" fill="#29172f"/>
      <rect x="105" y="164" width="17" height="48" fill="#63ede5"/><rect x="224" y="158" width="17" height="56" fill="#63ede5"/>
      <rect x="114" y="148" width="19" height="13" fill="#4cbab7"/><rect x="213" y="143" width="20" height="13" fill="#4cbab7"/>
    </g>
    <g fill="#f8d6ae">
      <rect class="steam one" x="151" y="96" width="10" height="22"/>
      <rect class="steam two" x="183" y="88" width="10" height="22"/>
    </g>
    <rect x="142" y="279" width="84" height="14" fill="#171631"/><rect x="156" y="294" width="56" height="10" fill="#242044"/>
    <rect x="369" y="275" width="68" height="28" rx="4" fill="#13172c" stroke="#5b528d" stroke-width="4"/>
    <g><rect class="key-a" x="381" y="284" width="8" height="8" fill="#ffcf66"/><rect class="key-b" x="397" y="284" width="8" height="8" fill="#63ede5"/><rect class="key-c" x="413" y="284" width="8" height="8" fill="#ff6d74"/></g>
  </g>

  <g font-family="Consolas,'Courier New',monospace">
    <text x="555" y="165" fill="#fff3dc" font-size="68" font-weight="800" letter-spacing="9">SALTY STEAK</text>
    <text x="561" y="211" fill="#c9c2ef" font-size="20" letter-spacing="3">BASE STEAK 2.0  /  WINDOWS BUILD</text>
    <text x="561" y="252" fill="#ffcf66" font-size="17" letter-spacing="1.5">MD ANIK HASAN  /  SAWLPER</text>
  </g>

  <g class="pixel" font-family="Consolas,'Courier New',monospace" font-size="15" font-weight="700">
    <g class="mode-a" transform="translate(557 292)"><rect width="104" height="34" rx="4" fill="#143c51"/><text x="20" y="22" fill="#63ede5">CHAT</text></g>
    <g class="mode-b" transform="translate(677 292)"><rect width="132" height="34" rx="4" fill="#46345e"/><text x="18" y="22" fill="#d7c6ff">RESEARCH</text></g>
    <g class="mode-c" transform="translate(825 292)"><rect width="110" height="34" rx="4" fill="#52313e"/><text x="23" y="22" fill="#ff9a8e">AGENT</text></g>
    <g class="mode-d" transform="translate(951 292)"><rect width="110" height="34" rx="4" fill="#51431f"/><text x="23" y="22" fill="#ffdb73">IMAGE</text></g>
  </g>

  <g class="pixel" opacity=".9">
    <rect x="470" y="389" width="760" height="3" fill="#28345f"/>
    <g class="packet-a"><rect x="486" y="383" width="18" height="15" fill="#63ede5"/><rect x="504" y="387" width="9" height="7" fill="#fff2cf"/></g>
    <g class="packet-b"><rect x="1210" y="404" width="18" height="15" fill="#ff6d74"/><rect x="1201" y="408" width="9" height="7" fill="#ffcf66"/></g>
  </g>

  <g class="pixel" opacity=".86">
    <path d="M1108 151h34v-8h88v8h26M1108 289h44v8h68v-8h36" fill="none" stroke="#554f91" stroke-width="5"/>
    <rect class="signal-a" x="1135" y="168" width="91" height="9" fill="#63ede5"/><rect class="signal-b" x="1135" y="192" width="63" height="7" fill="#776bd1"/>
    <rect class="signal-c" x="1135" y="214" width="78" height="7" fill="#ff6d74"/><rect class="signal-a" x="1135" y="236" width="48" height="7" fill="#ffcf66"/>
    <rect class="signal-b" x="1135" y="264" width="22" height="14" fill="#63ede5"/><rect class="signal-c" x="1165" y="255" width="22" height="23" fill="#776bd1"/><rect class="signal-a" x="1195" y="246" width="22" height="32" fill="#ff6d74"/>
    <text class="ready" x="1135" y="284" fill="#fff2cf" font-family="Consolas,monospace" font-size="12" letter-spacing="2">READY</text>
  </g>
</svg>
